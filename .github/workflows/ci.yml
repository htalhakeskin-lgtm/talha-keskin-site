# CI (15-git-ve-ci §7). No database: content is static (ADR-0001), so there are no service
# containers or migrations. Pin third-party actions to a full commit SHA in the project
# (`uses: actions/checkout@<sha> # v5`); Dependabot keeps the SHAs current.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly: full-history secret scan + all browsers
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium ${{ github.event_name == 'schedule' && 'webkit' || '' }}
      - run: pnpm exec playwright test --project=mobile --project=desktop ${{ github.event_name == 'schedule' && '--project=iphone' || '' }}
      # Lighthouse CI on the same build (12-performans §8): performance warns, a11y / best practices fail.
      - run: pnpm lighthouse
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          { name: lighthouse, path: .lighthouseci, retention-days: 7, if-no-files-found: ignore }

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - name: Secret scan (PR commits; full history on schedule)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gitleaks git --redact --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            ./gitleaks git --redact
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
